services:
  react-chat:
    image: models-chat-react:files-chat
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:80"
    restart: unless-stopped
    container_name: models-chat-react
    networks:
      - ollama-net

networks:
  ollama-net:
    external: true
